<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数値のデジタル表現 教材</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <canvas id="stage" aria-label="数値のデジタル表現を可視化する背景"></canvas>

  <div id="startOverlay" class="start-overlay">
    <div class="start-panel">
      <div class="start-kicker">情報I / 数値のデジタル表現</div>
      <h1>数値のデジタル表現</h1>
      <button id="startButton" class="start-button" type="button">
        <span>始める</span>
        <strong>全画面表示</strong>
      </button>
    </div>
  </div>

  <header class="hud" aria-live="polite">
    <div class="hud-main">
      <div class="hud-label">数値のデジタル表現</div>
      <div id="stageTitle" class="hud-title">準備中</div>
    </div>
    <div class="hud-badges">
      <span id="valueBadge" class="badge badge-source">0</span>
      <span id="bitBadge" class="badge">1 / 32 bit</span>
      <span id="limitBadge" class="badge">最大 4,294,967,295</span>
    </div>
  </header>

  <nav id="divisionControls" class="division-controls" aria-label="割る数を選ぶ">
    <form id="divisionValueForm" class="division-value-form" aria-label="割り算の数値を変更する">
      <input id="divisionValueInput" class="division-value-input" type="number" min="0" step="1" value="0">
      <button id="divisionValueButton" class="division-value-button" type="submit">変更</button>
    </form>
    <button class="divisor-button is-active" type="button" data-divisor="2">÷2</button>
    <button class="divisor-button" type="button" data-divisor="10">÷10</button>
    <button class="divisor-button" type="button" data-divisor="16">÷16</button>
  </nav>

  <main id="numberStage" class="number-stage" aria-live="polite">
    <section class="radix-column decimal-column" data-kind="decimal">
      <div class="radix-head">
        <div>
          <div class="radix-title">10進数</div>
        </div>
      </div>
      <div class="digit-area">
        <div id="decimalDigits" class="digit-row decimal-row"></div>
      </div>
      <div id="decimalMetrics" class="metric-row"></div>
    </section>

    <section class="radix-column binary-column" data-kind="binary">
      <div class="radix-head">
        <div>
          <div class="radix-title">2進数</div>
        </div>
      </div>
      <div class="digit-area">
        <div id="binaryDigits" class="digit-row binary-row"></div>
      </div>
      <div id="binaryMetrics" class="metric-row"></div>
    </section>

    <section class="radix-column hex-column" data-kind="hex">
      <div class="radix-head">
        <div>
          <div class="radix-title">16進数</div>
        </div>
      </div>
      <div class="digit-area">
        <div id="hexDigits" class="digit-row hex-row"></div>
      </div>
      <div id="hexMetrics" class="metric-row"></div>
    </section>
  </main>

  <section id="remainderStage" class="remainder-stage" aria-live="polite" aria-label="割り算の余り">
    <div id="remainderTrack" class="remainder-track"></div>
  </section>

  <button id="divisionModeButton" class="division-mode-button" type="button" title="割り算モードへ" aria-label="割り算モードへ">÷</button>

  <div id="notice" class="notice" hidden></div>
  <div id="stepSplash" class="step-splash" hidden></div>
  <div id="frameFlash" class="frame-flash" aria-hidden="true"></div>
  <div id="carryLayer" class="carry-layer" aria-hidden="true"></div>

  <footer class="control-bar">
    <label class="speed-control" for="speedRange">
      <span>スピード</span>
      <input id="speedRange" type="range" min="1" max="10000" step="1" value="8">
      <output id="speedOutput">8 / 秒</output>
    </label>
    <button id="resetButton" class="reset-button" type="button">リセット</button>
  </footer>

  <script src="./js/app.js" defer></script>
</body>
</html>
