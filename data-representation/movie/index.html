<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>動画のデジタル表現と圧縮 教材</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <canvas id="stage" aria-label="動画のデジタル表現と圧縮を可視化する教材"></canvas>

  <div id="startOverlay" class="start-overlay">
    <div class="start-panel">
      <div class="start-kicker">情報I / 動画のデジタル表現</div>
      <h1>動画が 0 と 1 になる瞬間を見よう</h1>
      <p>Webカメラで2秒間の動画を撮影し、フレームの並び、1枚の画像としての符号化、そして差分圧縮でデータ量が変わる様子を確認します。</p>
      <button id="startButton" class="start-button" type="button">
        <span>クリックして開始</span>
        <strong>カメラON・全画面表示</strong>
      </button>
    </div>
  </div>

  <header class="hud" aria-live="polite">
    <div class="hud-main">
      <div class="hud-label">動画のデジタル表現と圧縮</div>
      <div id="slideTitle" class="hud-title">準備中</div>
    </div>
    <div class="hud-badges">
      <span id="slideBadge" class="badge">SLIDE 0</span>
      <span id="sourceBadge" class="badge badge-source">入力: 待機</span>
      <span id="fpsBadge" class="badge">5 fps</span>
      <span id="resolutionBadge" class="badge">20 × 15</span>
      <span id="dataBadge" class="badge" hidden>- B</span>
    </div>
  </header>

  <aside id="infoPanel" class="info-panel" aria-live="polite" hidden>
    <div class="info-panel-title">データ量</div>
    <dl id="infoStats"></dl>
  </aside>

  <section id="cameraPanel" class="camera-panel" hidden>
    <button id="captureButton" class="primary-button" type="button">撮影</button>
  </section>

  <section id="adjustPanel" class="adjust-panel" hidden>
    <label class="control-row" for="fpsRange">
      <span>フレームレート</span>
      <input id="fpsRange" type="range" min="1" max="30" step="1" value="5">
      <output id="fpsOutput">5fps</output>
    </label>
    <label class="control-row" for="widthRange">
      <span>横の画素数</span>
      <input id="widthRange" type="range" min="10" max="160" step="5" value="20">
      <output id="widthOutput">20</output>
    </label>
    <label class="control-row" for="heightRange">
      <span>縦の画素数</span>
      <input id="heightRange" type="range" min="10" max="120" step="5" value="15">
      <output id="heightOutput">15</output>
    </label>
    <label class="control-row" for="levelRange">
      <span>階調</span>
      <input id="levelRange" type="range" min="1" max="8" step="1" value="8">
      <output id="levelOutput">256</output>
    </label>
    <button id="compressButton" class="compress-switch" type="button" role="switch" aria-checked="false">
      <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
      <span class="switch-label">圧縮 OFF</span>
    </button>
  </section>

  <div id="notice" class="notice" hidden></div>
  <div id="stepSplash" class="step-splash" hidden></div>
  <div id="flash" class="flash" aria-hidden="true"></div>
  <div id="frameFlash" class="frame-flash" aria-hidden="true"></div>

  <footer class="legend" aria-label="工程の凡例">
    <div class="legend-item" data-stage="camera">
      <span class="legend-icon icon-camera"></span>
      <span>撮影</span>
    </div>
    <div class="legend-item" data-stage="frames">
      <span class="legend-icon icon-frames"></span>
      <span>フレーム</span>
    </div>
    <div class="legend-item" data-stage="encoding">
      <span class="legend-icon icon-encoding"></span>
      <span>符号化</span>
    </div>
    <div class="legend-item" data-stage="compression">
      <span class="legend-icon icon-compression"></span>
      <span>圧縮</span>
    </div>
  </footer>

  <video id="cameraVideo" playsinline muted autoplay hidden></video>

  <script src="./js/app.js" defer></script>
</body>
</html>
