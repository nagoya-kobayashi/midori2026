<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>クロスワード</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="loginScreen" class="login-screen">
      <section class="login-panel">
        <h1>クロスワード</h1>
        <div id="authStatus" class="auth-status">ログインを確認しています…</div>
        <div id="authIdentity" class="auth-identity" hidden>
          <div id="authClassLine" class="auth-class-line"></div>
          <div id="authNameLine" class="auth-name-line"></div>
        </div>
        <div id="authError" class="auth-error" hidden></div>
        <div class="auth-actions">
          <button id="authLoginButton" class="primary-button" type="button" hidden>ログイン</button>
          <button id="authStartButton" class="primary-button" type="button" hidden>はじめる</button>
          <button id="authLogoutButton" class="ghost-button" type="button" hidden>ログアウト</button>
        </div>
      </section>
    </main>

    <main id="gameScreen" class="game-screen" hidden>
      <header class="top-bar">
        <div id="playerBadge" class="player-badge"></div>
        <div id="scoreBadge" class="score-badge"></div>
      </header>

      <section class="game-layout">
        <section class="board-pane">
          <div id="crosswordGrid" class="crossword-grid" aria-label="クロスワード盤面"></div>
          <div id="hintBox" class="hint-box">
            <div>タテ：</div>
            <div>ヨコ：</div>
          </div>
        </section>

        <section class="side-pane">
          <section class="card-pane">
            <div id="cardGrid" class="card-grid" aria-label="文字カード"></div>
          </section>
          <section class="ranking-pane">
            <h3 class="ranking-title">クラス順位 (トップ10)</h3>
            <ol id="rankingList" class="ranking-list" aria-live="polite"></ol>
          </section>
        </section>
      </section>
    </main>

    <div id="moveHelp" class="move-help" hidden>
      <div class="move-help-panel">
        <p>矢印キーでカーソル移動</p>
        <button id="moveHelpClose" class="primary-button" type="button">OK</button>
      </div>
    </div>

    <div id="termOverlay" class="term-overlay" hidden>
      <article class="term-card">
        <h2 id="termTitle"></h2>
        <p id="termExplanation"></p>
        <button id="termCloseButton" class="primary-button" type="button">閉じる</button>
      </article>
    </div>

    <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

    <script src="config.js"></script>
    <script src="../auth/config.js"></script>
    <script src="../auth/auth-client.js"></script>
    <script src="embedded-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
