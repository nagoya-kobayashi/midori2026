<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>共通認証システム</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./config.js"></script>
    <script src="./auth-client.js"></script>
  </head>
  <body>
    <header>
      <h1>共通認証システム</h1>
      <p>midori2026 配下の学習アプリで利用する共通ログイン確認ページです。</p>
    </header>

    <main>
      <section aria-labelledby="status-title">
        <h2 id="status-title">現在の状態</h2>
        <div class="status-grid">
          <div class="status-item">
            <span class="status-label">状態</span>
            <span class="status-value" id="statusText">確認中</span>
          </div>
          <div class="status-item">
            <span class="status-label">ユーザID</span>
            <span class="status-value" id="userIdText">-</span>
          </div>
          <div class="status-item">
            <span class="status-label">氏名</span>
            <span class="status-value" id="displayNameText">-</span>
          </div>
          <div class="status-item">
            <span class="status-label">クラス</span>
            <span class="status-value" id="classIdText">-</span>
          </div>
          <div class="status-item">
            <span class="status-label">出席番号</span>
            <span class="status-value" id="numberText">-</span>
          </div>
          <div class="status-item">
            <span class="status-label">端末ID</span>
            <span class="status-value" id="deviceIdText">-</span>
          </div>
        </div>
        <div class="notice" id="configNotice" hidden>
          GASエンドポイントが未設定です。config.js の GAS_ENDPOINT をデプロイ済みGAS WebアプリURLに変更してください。
        </div>
      </section>

      <section aria-labelledby="login-title">
        <h2 id="login-title">ログイン</h2>
        <form id="loginForm">
          <label>
            ユーザID
            <input id="loginUserId" name="userId" type="text" autocomplete="username" required />
          </label>
          <label>
            パスワード
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
          </label>
          <div class="button-row">
            <button class="primary" type="submit">ログイン</button>
            <button class="danger" type="button" id="logoutButton">ログアウト</button>
            <a class="button-link" href="./admin/">管理画面</a>
          </div>
        </form>
        <p class="message" id="loginMessage" aria-live="polite"></p>
      </section>

      <section aria-labelledby="test-title">
        <h2 id="test-title">認証テスト</h2>
        <div class="button-row">
          <button type="button" id="verifyButton">現在のトークンを確認</button>
          <button type="button" id="healthButton">GAS接続確認</button>
        </div>
        <pre id="testOutput" aria-live="polite">{}</pre>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        var elements = {
          statusText: document.getElementById("statusText"),
          userIdText: document.getElementById("userIdText"),
          displayNameText: document.getElementById("displayNameText"),
          classIdText: document.getElementById("classIdText"),
          numberText: document.getElementById("numberText"),
          deviceIdText: document.getElementById("deviceIdText"),
          configNotice: document.getElementById("configNotice"),
          loginForm: document.getElementById("loginForm"),
          loginUserId: document.getElementById("loginUserId"),
          loginPassword: document.getElementById("loginPassword"),
          logoutButton: document.getElementById("logoutButton"),
          loginMessage: document.getElementById("loginMessage"),
          verifyButton: document.getElementById("verifyButton"),
          healthButton: document.getElementById("healthButton"),
          testOutput: document.getElementById("testOutput"),
        };

        MidoriAuth.init({ appId: "auth", appName: "共通認証システム" });

        document.addEventListener("DOMContentLoaded", boot);
        elements.loginForm.addEventListener("submit", handleLogin);
        elements.logoutButton.addEventListener("click", handleLogout);
        elements.verifyButton.addEventListener("click", handleVerify);
        elements.healthButton.addEventListener("click", handleHealth);

        async function boot() {
          elements.deviceIdText.textContent = MidoriAuth.getDeviceId();
          elements.configNotice.hidden = !isEndpointPlaceholder();

          var ticketResult = await MidoriAuth.consumeOneTimeTicketIfPresent();
          if (ticketResult.ok && ticketResult.mode === "user") {
            renderStatus(ticketResult);
            setMessage("OneTimeTicketでログインしました。", "ok");
            redirectIfSafe();
            return;
          }

          var session = MidoriAuth.getStoredSession();
          if (session.userId) {
            elements.loginUserId.value = session.userId;
          }

          try {
            var result = await MidoriAuth.verifyToken();
            renderStatus(result);
          } catch (error) {
            renderStatus({
              ok: true,
              mode: "guest",
              authenticated: false,
              user: null,
              deviceId: MidoriAuth.getDeviceId(),
              reason: error.reason || "network_error",
            });
          }
        }

        async function handleLogin(event) {
          event.preventDefault();
          setMessage("ログインを確認しています。", "");
          try {
            var result = await MidoriAuth.login(elements.loginUserId.value, elements.loginPassword.value);
            elements.loginPassword.value = "";
            renderStatus(result);
            setMessage("ログインしました。", "ok");
            redirectIfSafe();
          } catch (error) {
            setMessage(error.userMessage || "ログインできませんでした。", "error");
          }
        }

        async function handleLogout() {
          setMessage("ログアウトしています。", "");
          await MidoriAuth.logout();
          renderStatus({
            ok: true,
            mode: "guest",
            authenticated: false,
            user: null,
            deviceId: MidoriAuth.getDeviceId(),
            reason: "not_logged_in",
          });
          setMessage("ログアウトしました。", "ok");
        }

        async function handleVerify() {
          try {
            var result = await MidoriAuth.verifyToken();
            renderStatus(result);
            printJson(result);
          } catch (error) {
            printJson({ ok: false, error: error.reason || "network_error" });
          }
        }

        async function handleHealth() {
          try {
            var result = await MidoriAuth.post("health", {});
            printJson(result);
          } catch (error) {
            printJson({ ok: false, error: error.reason || "network_error" });
          }
        }

        function renderStatus(result) {
          var user = result && result.user ? result.user : null;
          elements.statusText.textContent = result && result.mode === "user" ? "ログイン済み" : "未ログイン";
          elements.userIdText.textContent = user ? user.userId || "-" : "-";
          elements.displayNameText.textContent = user ? user.displayName || "-" : "-";
          elements.classIdText.textContent = user ? user.classId || "-" : "-";
          elements.numberText.textContent = user ? user.number || "-" : "-";
          elements.deviceIdText.textContent = MidoriAuth.getDeviceId();
          if (user && user.userId) {
            elements.loginUserId.value = user.userId;
          }
        }

        function setMessage(text, type) {
          elements.loginMessage.textContent = text;
          elements.loginMessage.className = "message" + (type ? " " + type : "");
        }

        function printJson(value) {
          elements.testOutput.textContent = JSON.stringify(value, null, 2);
        }

        function isEndpointPlaceholder() {
          var endpoint = String(MIDORI_AUTH_CONFIG.GAS_ENDPOINT || "");
          return !endpoint || endpoint.indexOf("ここに") === 0;
        }

        function redirectIfSafe() {
          var returnTo = getReturnTo();
          if (returnTo) {
            window.location.assign(returnTo);
          }
        }

        function getReturnTo() {
          var paramName = MIDORI_AUTH_CONFIG.RETURN_TO_PARAM || "returnTo";
          var value = new URL(window.location.href).searchParams.get(paramName);
          if (!value) {
            return "";
          }

          try {
            var target = new URL(value, window.location.origin);
            if (target.origin !== window.location.origin) {
              return "";
            }
            var allowedPrefix = String(MIDORI_AUTH_CONFIG.AUTH_BASE_PATH || "/midori2026/auth/")
              .replace(/auth\/?$/, "");
            if (!allowedPrefix || allowedPrefix === "/" || target.pathname.indexOf(allowedPrefix) !== 0) {
              return "";
            }
            return target.pathname + target.search + target.hash;
          } catch (error) {
            return "";
          }
        }
      })();
    </script>
  </body>
</html>
